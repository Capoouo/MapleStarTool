<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>技能冷卻計時器 </title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #fff;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            display: flex;
            gap: 15px;
            padding: 20px;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none; /* 防止連續點擊時選取到文字 */
        }
        .skill-btn {
            background: #2d2d2d;
            border: 2px solid #444;
            border-radius: 12px;
            padding: 20px 15px;
            width: 140px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }
        /* 滑鼠懸停效果 */
        .skill-btn:hover {
            background: #383838;
            border-color: #666;
        }
        /* 點擊按下的縮放效果 */
        .skill-btn:active {
            transform: scale(0.95);
        }
        /* 當在冷卻中時，滑鼠指標變成不允許點擊 */
        .skill-btn.cooldown {
            cursor: not-allowed;
        }
        .skill-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #f1c40f; /* 金色技能名 */
        }
        .cd-display {
            font-size: 26px;
            color: #2ed573; /* 預設 READY 綠色 */
            font-weight: bold;
            height: 35px;
            line-height: 35px;
        }
        .click-hint {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
            border-top: 1px solid #444;
            padding-top: 5px;
        }
        /* 倒數遮罩效果 */
        .mask {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            transform: translateY(100%);
            transition: transform 0.1s linear;
            pointer-events: none; /* 讓遮罩不擋住滑鼠點擊事件 */
        }
    </style>
</head>
<body>

    <div class="skill-btn" id="skill-a" onclick="triggerSkill('a')">
        <div class="mask" id="mask-a"></div>
        <div class="skill-name">女皇反盾</div>
        <div class="cd-display" id="cd-a">READY</div>
        <div class="click-hint">點擊觸發 (80s)</div>
    </div>

    <div class="skill-btn" id="skill-b" onclick="triggerSkill('b')">
        <div class="mask" id="mask-b"></div>
        <div class="skill-name">女皇變豬</div>
        <div class="cd-display" id="cd-b">READY</div>
        <div class="click-hint">點擊觸發 (60s)</div>
    </div>

    <div class="skill-btn" id="skill-c" onclick="triggerSkill('c')">
        <div class="mask" id="mask-c"></div>
        <div class="skill-name">女皇鎖潛</div>
        <div class="cd-display" id="cd-c">READY</div>
        <div class="click-hint">點擊觸發 (90s)</div>
    </div>

    <div class="skill-btn" id="skill-d" onclick="triggerSkill('d')">
        <div class="mask" id="mask-d"></div>
        <div class="skill-name">女皇活屍</div>
        <div class="cd-display" id="cd-d">READY</div>
        <div class="click-hint">點擊觸發 (60s)</div>
    </div>

    <div class="skill-btn" id="skill-e" onclick="triggerSkill('e')">
        <div class="mask" id="mask-e"></div>
        <div class="skill-name">皮卡丘反盾</div>
        <div class="cd-display" id="cd-e">READY</div>
        <div class="click-hint">點擊觸發 (45s)</div>
    </div>

    <script>
        // 技能資料初始化
        const skills = {
            'a': { name: '女皇反盾', cd: 80, current: 0, timer: null },
            'b': { name: '女皇變豬', cd: 60, current: 0, timer: null },
            'c': { name: '女皇鎖潛', cd: 90, current: 0, timer: null },
            'd': { name: '女皇活屍', cd: 60, current: 0, timer: null },
            'e': { name: '皮卡丘反盾', cd: 45, current: 0, timer: null }
        };

        // 由按鈕的 onclick 事件觸發
        function triggerSkill(key) {
            const skill = skills[key];
            // 如果正在冷卻中，拒絕重複觸發
            if (!skill || skill.current > 0) return; 

            skill.current = skill.cd;
            
            // 給按鈕加上 cooldown 的樣式（改變滑鼠指標）
            document.getElementById(`skill-${key}`).classList.add('cooldown');
            
            updateUI(key);

            // 每 0.1 秒更新一次時間
            skill.timer = setInterval(() => {
                skill.current -= 0.1;

                if (skill.current <= 0) {
                    skill.current = 0;
                    clearInterval(skill.timer);
                    skill.timer = null;
                    // 冷卻結束，移除 cooldown 樣式
                    document.getElementById(`skill-${key}`).classList.remove('cooldown');
                }
                updateUI(key);
            }, 100);
        }

        // 更新 UI 畫面
        function updateUI(key) {
            const skill = skills[key];
            const cdDisplay = document.getElementById(`cd-${key}`);
            const mask = document.getElementById(`mask-${key}`);

            if (skill.current > 0) {
                cdDisplay.innerText = skill.current.toFixed(1) + 's';
                cdDisplay.style.color = '#ff4757'; // 冷卻中變紅
                
                const percent = (skill.current / skill.cd) * 100;
                mask.style.transform = `translateY(${100 - percent}%)`;
            } else {
                cdDisplay.innerText = 'READY';
                cdDisplay.style.color = '#2ed573'; // 準備就緒變綠
                mask.style.transform = 'translateY(100%)';
            }
        }
    </script>
</body>
</html>
